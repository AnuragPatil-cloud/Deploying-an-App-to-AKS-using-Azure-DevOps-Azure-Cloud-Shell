apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-application
  template:
    metadata:
      labels:
        app: k8s-application
    spec:
      containers:
        - name: k8s-application
          image: anuragpatilcloud/k8s-application:latest
          ports:
          - containerPort: 8888
